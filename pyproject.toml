[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aacam"
version = "0.1.0"
description = "ArcheAge Classic addon manager for Linux (Wine, Proton, Lutris, Bottles)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
aacam = "aacam.cli:main"

[project.gui-scripts]
aacam-gui = "aacam.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aacam = ["icon.png"]
