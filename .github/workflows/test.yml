name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon0
      - run: pip install PyYAML PySide6
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

  arch:
    # Arch Linux first: the tests, GUI flows included, on Arch's own Python and PySide6 packages.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm python python-yaml pyside6 git ca-certificates
      - uses: actions/checkout@v4
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: PYTHONPATH=src python -m aacam doctor --network --strict
