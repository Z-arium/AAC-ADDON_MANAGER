name: release
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create from this commit, e.g. v0.1.0 (leave empty to only build)"
        required: false
permissions:
  contents: write
jobs:
  appimage:
    # Oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 libegl1 libxkbcommon0
      - run: pip install PyYAML
      - run: PYTHONPATH=src python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
      - run: packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ArcheAge-Classic-Linux-Launcher-x86_64.AppImage
          path: dist/ArcheAge-Classic-Linux-Launcher-x86_64.AppImage
      - if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The release may already exist if it was drafted on GitHub first.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ArcheAge-Classic-Linux-Launcher-x86_64.AppImage --clobber
          else
            gh release create "$TAG" dist/ArcheAge-Classic-Linux-Launcher-x86_64.AppImage \
              --target "$GITHUB_SHA" --title "ArcheAge Classic Linux Launcher $TAG" --generate-notes
          fi
